plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id "org.sonarqube" version "4.0.0.2929"
    id "org.jetbrains.dokka" version "2.2.0"
}

group = 'com.github.crazzyghost'

version '1.8.0'


publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

tasks.jar {
    manifest {
        attributes(
                "Automatic-Module-Name": "com.github.crazzyghost.alphavantage"
        )
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}


repositories {
    mavenCentral()
}

jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

test {
    finalizedBy jacocoTestReport
}

sonar {
    properties {
        property "sonar.projectKey", "crazzyghost_alphavantage-java"
        property "sonar.organization", "crazzyghost"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.13.1'
    testImplementation 'com.github.gmazzo.okhttp.mock:mock-client:2.1.0'
    testImplementation 'com.squareup.okhttp3:logging-interceptor:4.5.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.moshi:moshi:1.9.2'
    dokkaPlugin "org.jetbrains.dokka:kotlin-as-java-plugin:2.2.0"
}

dokka {
    dokkaPublications {
        html {
            outputDirectory.set(file("docs/api"))
        }
    }
    pluginsConfiguration {
        html {
            homepageLink.set("https://crazzyghost.github.io/alphavantage-java/")
        }
    }
}
